<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <!-- 文档类型声明 -->
    <!-- 使用中文语言，优化中文显示 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俄罗斯方块</title>
    <!-- CSS样式开始 -->
    <style>
        /* 重置默认样式，设置字体 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        /* 页面布局 */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
        }

        /* 游戏容器定位 */
        .game-container {
            position: relative;
        }

        /* 游戏面板网格布局 */
        #game-board {
            display: grid;
            grid-template-columns: repeat(10, 30px); /* 10列 */
            grid-template-rows: repeat(20, 30px);    /* 20行 */
            gap: 1px;
            background-color: #333;
            padding: 1px;
        }

        /* 单元格样式 */
        .cell {
            width: 30px;
            height: 30px;
            background-color: #fff;
        }

        /* 计分板位置和样式 */
        .score-panel {
            position: absolute;
            top: 0;
            right: -150px;
            width: 120px;
            padding: 10px;
            background-color: #fff;
            border: 2px solid #333;
            border-radius: 5px;
            text-align: center;
        }

        /* 计分板标题样式 */
        .score-panel h2 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        /* 计分板段落样式 */
        .score-panel p {
            font-size: 16px;
            margin: 5px 0;
        }

        /* 方块颜色样式（对应七种形状） */
        .cell.I {
            background-color: #00ffff; /* 青色 */
        }

        .cell.O {
            background-color: #ffff00; /* 黄色 */
        }

        .cell.T {
            background-color: #a020f0; /* 紫色 */
        }

        .cell.L {
            background-color: #ffa500; /* 橙色 */
        }

        .cell.J {
            background-color: #0000ff; /* 蓝色 */
        }

        .cell.Z {
            background-color: #ff0000; /* 红色 */
        }

        .cell.S {
            background-color: #00ff00; /* 绿色 */
        }
    </style>
</head>

<body>
    <!-- 游戏主容器 -->
    <div class="game-container">
        <!-- 游戏面板 -->
        <div id="game-board"></div>
        <!-- 计分板 -->
        <div class="score-panel">
            <h2>得分</h2>
            <p id="score">0</p>
            <h2>提示</h2>
            <p>↑：旋转</p>
            <p>←→：移动</p>
            <p>↓：加速下落</p>
        </div>
    </div>

    <!-- JavaScript主要逻辑部分 -->
    <script>
        // 游戏常量定义
        const ROWS = 20;       // 游戏区域行数
        const COLS = 10;       // 游戏区域列数
        const CELL_SIZE = 30;  // 每个格子的尺寸

        // 七种俄罗斯方块的形状定义（使用二维数组表示，1表示方块占据，0表示空）
        const SHAPES = [
            // I型 - 一条直线
            [[1, 1, 1, 1]],
            // O型 - 正方形
            [[1, 1], [1, 1]],
            // T型 - T字形
            [[0, 1, 0], [1, 1, 1]],
            // L型 - L字形
            [[0, 0, 1], [1, 1, 1]],
            // J型 - J字形
            [[1, 0, 0], [1, 1, 1]],
            // Z型 - Z字形
            [[1, 1, 0], [0, 1, 1]],
            // S型 - S字形
            [[0, 1, 1], [1, 1, 0]]
        ];

        // 方块对应的颜色类名，与CSS类名一致
        const SHAPE_COLORS = ['I', 'O', 'T', 'L', 'J', 'Z', 'S'];

        // 游戏状态变量
        let board = [];         // 游戏面板二维数组，存储每个单元格的状态
        let currentPiece = null; // 当前正在下落的方块对象
        let currentX = 0;       // 当前方块的X坐标（列位置）
        let currentY = 0;       // 当前方块的Y坐标（行位置）
        let score = 0;          // 游戏得分
        let gameInterval = null; // 游戏主循环定时器
        let dropSpeed = 1000;   // 方块下落速度（毫秒）

        /**
         * 初始化游戏面板
         * 创建ROWS x COLS的二维数组和对应的DOM元素
         */
        function initBoard() {
            const gameBoard = document.getElementById('game-board');
            gameBoard.innerHTML = '';  // 清空现有内容
            board = [];  // 重置游戏面板数据

            // 创建二维数组和DOM元素
            for (let y = 0; y < ROWS; y++) {
                board[y] = [];  // 初始化每一行
                for (let x = 0; x < COLS; x++) {
                    board[y][x] = '';  // 空字符串表示该格子为空

                    // 创建对应的单元格DOM元素
                    const cell = document.createElement('div');
                    cell.className = 'cell';  // 应用基础样式
                    cell.id = `cell-${y}-${x}`;  // 设置唯一ID
                    gameBoard.appendChild(cell);  // 添加到游戏面板
                }
            }
        }

        /**
         * 生成新的随机方块
         * 从SHAPES数组中随机选择一个形状，并设置其初始位置
         */
        function generatePiece() {
            const randomIndex = Math.floor(Math.random() * SHAPES.length);  // 随机选择方块索引
            const shape = SHAPES[randomIndex];  // 获取方块形状
            const color = SHAPE_COLORS[randomIndex];  // 获取方块颜色

            // 设置初始位置：水平居中，垂直在顶部
            currentX = Math.floor(COLS / 2) - Math.floor(shape[0].length / 2);  // 计算起始列位置
            currentY = 0;  // 起始行位置为0
            currentPiece = { shape, color };  // 保存当前方块信息

            // 检查新方块是否与已有方块重叠（游戏结束条件）
            if (!isValidPosition(currentY, currentX, currentPiece.shape)) {
                alert('游戏结束！你的得分：' + score);
                clearInterval(gameInterval);  // 停止游戏循环
                resetGame();  // 重置游戏
            }
        }

        /**
         * 绘制游戏场景
         * 更新DOM元素以反映当前游戏面板和方块状态
         */
        function draw() {
            // 遍历并更新所有单元格的样式
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const cell = document.getElementById(`cell-${y}-${x}`);
                    cell.className = 'cell';  // 重置为基本样式

                    // 如果该格子有方块颜色，则添加相应类名
                    if (board[y][x]) {
                        cell.classList.add(board[y][x]);
                    }
                }
            }

            // 绘制当前正在下落的方块
            if (currentPiece) {
                const { shape, color } = currentPiece;

                // 遍历当前方块的每个部分
                for (let y = 0; y < shape.length; y++) {
                    for (let x = 0; x < shape[y].length; x++) {
                        // 如果当前方块的此位置有格子
                        if (shape[y][x]) {
                            const boardY = currentY + y;  // 对应游戏面板的行
                            const boardX = currentX + x;  // 对应游戏面板的列

                            // 确保坐标在游戏面板范围内
                            if (boardY >= 0 && boardY < ROWS && boardX >= 0 && boardX < COLS) {
                                const cell = document.getElementById(`cell-${boardY}-${boardX}`);
                                cell.classList.add(color);  // 添加颜色类名
                            }
                        }
                    }
                }
            }
        }

        /**
         * 检查指定位置是否有效
         * @param {number} y - 行位置
         * @param {number} x - 列位置
         * @param {Array<Array<number>>} shape - 方块形状
         * @returns {boolean} - 位置是否有效
         */
        function isValidPosition(y, x, shape) {
            // 遍历方块的每个组成部分
            for (let dy = 0; dy < shape.length; dy++) {
                for (let dx = 0; dx < shape[dy].length; dx++) {
                    // 如果当前方块位置有格子
                    if (shape[dy][dx]) {
                        const ny = y + dy;  // 新的行位置
                        const nx = x + dx;  // 新的列位置

                        // 检查是否超出边界
                        if (ny >= ROWS || nx < 0 || nx >= COLS) {
                            return false;
                        }

                        // 检查是否与已固定的方块重叠（忽略y<0的情况，因为方块可能刚出现）
                        if (ny >= 0 && board[ny][nx]) {
                            return false;
                        }
                    }
                }
            }
            return true;  // 所有位置都有效
        }

        /**
         * 将当前方块固定到游戏面板上
         * 处理满行消除，并生成新方块
         */
        function lockPiece() {
            const { shape, color } = currentPiece;

            // 将当前方块的所有部分添加到游戏面板
            for (let y = 0; y < shape.length; y++) {
                for (let x = 0; x < shape[y].length; x++) {
                    if (shape[y][x]) {
                        const boardY = currentY + y;
                        const boardX = currentX + x;

                        // 只有当行位置非负时才设置（避免处理出现在顶部外的部分）
                        if (boardY >= 0) {
                            board[boardY][boardX] = color;
                        }
                    }
                }
            }

            // 检查并消除满行
            clearLines();
            // 生成新的方块
            generatePiece();
        }

        /**
         * 消除满行并计算得分
         * @returns {number} - 消除的行数
         */
        function clearLines() {
            let linesCleared = 0;  // 消除的行数

            // 从底部开始向上检查每一行
            for (let y = ROWS - 1; y >= 0; y--) {
                // 检查当前行是否满（所有格子都有颜色）
                const isFull = board[y].every(cell => cell !== '');

                if (isFull) {
                    linesCleared++;  // 增加消除行数

                    // 删除当前满行，并在顶部添加一行空行
                    board.splice(y, 1);  // 删除第y行
                    board.unshift(Array(COLS).fill(''));  // 在顶部添加空行

                    // 因为删除了一行，继续检查当前y位置（原y-1行现在处于y位置）
                    y++;
                }
            }

            // 根据消除的行数更新分数
            if (linesCleared > 0) {
                // 消除不同行数给予不同奖励分数
                score += linesCleared === 1 ? 100 : linesCleared === 2 ? 300 : linesCleared === 3 ? 500 : 800;
                document.getElementById('score').textContent = score;  // 更新分数显示
            }

            return linesCleared;  // 返回消除的行数
        }

        /**
         * 移动当前方块
         * @param {number} dx - X方向移动距离
         * @param {number} dy - Y方向移动距离
         * @returns {boolean} - 是否成功移动
         */
        function move(dx, dy) {
            // 检查移动后的新位置是否有效
            if (currentPiece && isValidPosition(currentY + dy, currentX + dx, currentPiece.shape)) {
                currentX += dx;  // 更新X坐标
                currentY += dy;  // 更新Y坐标
                draw();  // 重新绘制
                return true;  // 移动成功
            }

            // 如果是向下移动且无法继续向下
            if (dy > 0) {
                lockPiece();  // 固定方块
                draw();  // 重新绘制
            }
            return false;  // 移动失败
        }

        /**
         * 旋转当前方块
         * 使用矩阵转置的方式实现90度顺时针旋转
         */
        function rotate() {
            if (!currentPiece) return;  // 如果没有当前方块则直接返回

            // 实现矩阵顺时针旋转90度的算法
            // 原理：将原矩阵的列变成新矩阵的行，然后每行反转
            const rotatedShape = currentPiece.shape[0].map((_, index) =>
                currentPiece.shape.map(row => row[index]).reverse()
            );

            // 尝试几种不同的放置位置来解决旋转碰撞问题（简单的墙踢机制）
            if (isValidPosition(currentY, currentX, rotatedShape)) {
                // 直接旋转
                currentPiece.shape = rotatedShape;
            } else if (isValidPosition(currentY, currentX - 1, rotatedShape)) {
                // 向左偏移旋转
                currentX -= 1;
                currentPiece.shape = rotatedShape;
            } else if (isValidPosition(currentY, currentX + 1, rotatedShape)) {
                // 向右偏移旋转
                currentX += 1;
                currentPiece.shape = rotatedShape;
            }

            draw();  // 重新绘制
        }

        /**
         * 方块自动下落
         * 每隔指定时间执行一次
         */
        function drop() {
            move(0, 1);  // 向下移动一格
        }

        /**
         * 重置游戏
         * 清空面板、分数和定时器，准备新游戏
         */
        function resetGame() {
            score = 0;  // 重置分数
            document.getElementById('score').textContent = score;  // 更新分数显示
            initBoard();  // 初始化面板
            generatePiece();  // 生成第一个方块
            draw();  // 绘制初始状态

            // 重新启动游戏定时器
            if (gameInterval) clearInterval(gameInterval);  // 清除旧定时器
            gameInterval = setInterval(drop, dropSpeed);  // 设置新定时器
        }

        /**
         * 键盘事件监听器
         * 处理玩家输入控制方块移动和旋转
         */
        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowLeft':  // 左箭头：向左移动
                    move(-1, 0);
                    break;
                case 'ArrowRight':  // 右箭头：向右移动
                    move(1, 0);
                    break;
                case 'ArrowDown':  // 下箭头：向下移动（加速下降）
                    move(0, 1);
                    break;
                case 'ArrowUp':  // 上箭头：旋转方块
                    rotate();
                    break;
            }
        });

        /**
         * 页面加载完成后初始化游戏
         */
        window.onload = () => {
            resetGame();  // 开始新游戏
        };
    </script>
</body>

</html>
